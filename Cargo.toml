[package]
name = "agent-rs"
version = "0.1.0"
edition = "2024"
# cargo 可见的 Rust 下限，必须与 rust-toolchain.toml 的 channel 同 major.minor
rust-version = "1.98"

[dependencies]
async-openai = { version = "0.41.3", features = ["responses"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = {
    version = "1",
    features = ["full"]
}
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
serde_json = "1.0.151"
